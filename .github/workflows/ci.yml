name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CMAKE_CXX_STANDARD: 17  # whisper.cpp git version requires C++14+

jobs:
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-default-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check

  check-macos:
    name: Check (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-14
          - macos-15-large  # Intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-default-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-default-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --lib

  test-macos:
    name: Test (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-14
          - macos-15-large  # Intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-default-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --lib

  windows:
    name: Windows (check, test, smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --lib

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test transcription
        shell: bash
        run: ./scripts/smoke-transcribe.sh target/release/mojovoice.exe

  windows-desktop:
    name: Windows desktop installer
    # CUDA 12.x only supports host compilers up to Visual Studio 2022
    runs-on: windows-2022
    # Portable whisper.cpp CPU code: GGML_NATIVE would bake in the CI runner's CPU
    # features (it picked AVX-512, which most desktop CPUs lack)
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_BMI2: "ON"
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'

      # nvcc needs MSVC's cl.exe on PATH (Visual Studio developer environment)
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # whisper.cpp's Vulkan backend needs the Vulkan headers and glslc at build time
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/src-tauri -> target

      # CPU build: Candle + whisper.cpp (CPU) for GGML models
      - name: Build CLI
        run: cargo build --release --features whisper-cpp

      # whisper.cpp on Vulkan for AMD/Intel GPUs; needs vulkan-1.dll (GPU driver) at launch.
      # Short target dirs: whisper.cpp's nested vulkan-shaders-gen build otherwise exceeds
      # MSBuild's 260-character path limit.
      - name: Build CLI with Vulkan
        run: cargo build --release --features whisper-vulkan --target-dir D:\tv

      # Needs the CUDA 12 runtime at launch; the app only uses it when that's installed
      - name: Build CLI with CUDA
        env:
          CUDA_COMPUTE_CAP: "80"
        run: cargo build --release --features cuda,whisper-vulkan --target-dir D:\tc

      # Bundled into the installer next to the app (tauri.windows.conf.json externalBin)
      - name: Stage CLIs as Tauri sidecars
        shell: bash
        run: |
          mkdir -p ui/src-tauri/binaries
          cp target/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-x86_64-pc-windows-msvc.exe
          cp /d/tv/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-vulkan-x86_64-pc-windows-msvc.exe
          cp /d/tc/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-cuda-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build installer
        working-directory: ui
        run: npm run tauri build

      - name: Package CLI
        shell: pwsh
        run: Compress-Archive -Path target/release/mojovoice.exe, README.md, LICENSE -DestinationPath mojovoice-windows-x64.zip

      # Copy to the top level so the artifact isn't nested under the build path
      - name: Collect installer
        shell: bash
        run: cp ui/src-tauri/target/release/bundle/nsis/*-setup.exe MojoVoice-windows-x64-setup.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mojovoice-windows-x64
          path: |
            MojoVoice-windows-x64-setup.exe
            mojovoice-windows-x64.zip
          retention-days: 30

  build-cuda:
    name: Build CUDA (Linux)
    runs-on: ubuntu-latest
    continue-on-error: true  # CUDA build is optional - shouldn't block CI
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build essentials
        run: |
          apt-get update
          apt-get install -y curl build-essential cmake libclang-dev libasound2-dev pkg-config libxkbcommon-dev file libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-feat-cuda-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with CUDA
        env:
          CUDA_COMPUTE_CAP: "75" # Target RTX 20xx/30xx/40xx (sm_75 is compatible)
        run: cargo build --release --features cuda

      - name: List release outputs
        run: ls -la target/release

      - name: Verify CUDA artifact
        run: |
          test -f target/release/mojovoice || (echo "ERROR: target/release/mojovoice not found" && exit 1)
          file target/release/mojovoice
          # Note: Candle uses dynamic loading (dlopen) for CUDA, so libcudart won't appear in ldd
          # We verify the build succeeded and the binary is valid
          ./target/release/mojovoice --version || echo "Binary built (--version not implemented)"
          echo "✓ CUDA build completed successfully"

      - name: Hash CUDA artifact
        run: sha256sum target/release/mojovoice

      - name: Upload CUDA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojovoice-linux-x64-cuda
          path: target/release/mojovoice
          retention-days: 90

  build-metal:
    name: Build Metal (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-metal-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with Metal
        run: cargo build --release --features metal

      - name: Upload Metal artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojovoice-${{ matrix.os }}-arm64-metal
          path: target/release/mojovoice
          retention-days: 90

  build-artifacts-linux:
    name: Build Release (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Verify artifact
        run: |
          file target/release/mojovoice
          # CPU artifact should NOT depend on CUDA libraries
          echo "Checking ldd for CUDA libs (should be none):"
          if ldd target/release/mojovoice | grep -E 'libcudart|libcublas|libcudnn'; then
            echo "❌ ERROR: CPU artifact has CUDA dependencies!"
            exit 1
          fi
          echo "Checking readelf for CUDA NEEDED entries (should be none):"
          if readelf -d target/release/mojovoice | grep NEEDED | grep -E 'cudart|cublas|cudnn'; then
            echo "❌ ERROR: CPU artifact has CUDA in NEEDED section!"
            exit 1
          fi
          echo "✓ CPU artifact verified (no CUDA dependencies)"

      - name: Cache whisper-tiny
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mojovoice/models/whisper-tiny
          key: whisper-tiny-safetensors-v2

      - name: Smoke test transcription
        run: ./scripts/smoke-transcribe.sh target/release/mojovoice

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojovoice-linux-x64
          path: target/release/mojovoice
          retention-days: 90

  build-artifacts-macos:
    name: Build Release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS ARM64
            artifact: mojovoice-macos-arm64
          - os: macos-15-large
            name: macOS Intel
            artifact: mojovoice-macos-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-target-feat-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/mojovoice
          retention-days: 90

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-feat-default-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out Lcov --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
