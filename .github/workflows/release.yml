name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  # ==========================================================================
  # CLI Builds
  # ==========================================================================

  build-linux-cpu:
    name: Build Linux CLI (CPU)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev pkg-config libxkbcommon-dev

      - name: Build
        run: cargo build --release

      - name: Cache whisper-tiny
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mojovoice/models/whisper-tiny
          key: whisper-tiny-safetensors-v2

      - name: Smoke test transcription
        run: ./scripts/smoke-transcribe.sh target/release/mojovoice

      - name: Package binary
        run: |
          mkdir -p mojovoice-linux-x64
          cp target/release/mojovoice mojovoice-linux-x64/
          cp README.md mojovoice-linux-x64/
          cp LICENSE mojovoice-linux-x64/
          tar -czf mojovoice-linux-x64.tar.gz mojovoice-linux-x64/

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mojovoice-linux-x64.tar.gz
          asset_name: mojovoice-linux-x64.tar.gz
          asset_content_type: application/gzip

  build-macos-arm:
    name: Build macOS CLI (Apple Silicon)
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p mojovoice-macos-arm64
          cp target/release/mojovoice mojovoice-macos-arm64/
          cp README.md mojovoice-macos-arm64/
          cp LICENSE mojovoice-macos-arm64/
          tar -czf mojovoice-macos-arm64.tar.gz mojovoice-macos-arm64/

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mojovoice-macos-arm64.tar.gz
          asset_name: mojovoice-macos-arm64.tar.gz
          asset_content_type: application/gzip

  # ==========================================================================
  # Tauri Desktop App Builds
  # ==========================================================================

  build-tauri-linux:
    name: Build Desktop App (Linux)
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libclang-dev \
            libasound2-dev \
            pkg-config \
            libxkbcommon-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ui/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npm run tauri

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Tauri's bundler leaves .DirIcon as an absolute symlink into the runner's
      # build dir, which is broken on every other machine (AppImageHub rejects it).
      # Replace it with a real copy of the icon and repack. --appimage-extract
      # creates squashfs-root as 0700, so open up permissions before repacking or
      # sandboxed/other users can't enter the AppImage root (AppRun: Permission denied).
      - name: Fix AppImage .DirIcon
        working-directory: ui/src-tauri/target/release/bundle/appimage
        env:
          APPIMAGE: mojovoice_${{ steps.version.outputs.VERSION }}_amd64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract >/dev/null
          rm -f squashfs-root/.DirIcon
          cp squashfs-root/mojovoice.png squashfs-root/.DirIcon
          chmod -R a+rX squashfs-root
          ./appimagetool --no-appstream squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - name: Upload AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ui/src-tauri/target/release/bundle/appimage/mojovoice_${{ steps.version.outputs.VERSION }}_amd64.AppImage
          asset_name: MojoVoice-linux-x64.AppImage
          asset_content_type: application/octet-stream

      - name: Upload deb package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ui/src-tauri/target/release/bundle/deb/mojovoice_${{ steps.version.outputs.VERSION }}_amd64.deb
          asset_name: MojoVoice-linux-x64.deb
          asset_content_type: application/vnd.debian.binary-package

  build-windows:
    name: Build Windows (CLI + installer)
    needs: create-release
    # CUDA 12.x only supports host compilers up to Visual Studio 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # whisper.cpp's Vulkan backend needs the Vulkan headers and glslc at build time
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get version without v prefix
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # CPU build: Candle + whisper.cpp (CPU) for GGML models
      - name: Build CLI
        run: cargo build --release --features whisper-cpp

      - name: Smoke test transcription
        shell: bash
        run: ./scripts/smoke-transcribe.sh target/release/mojovoice.exe

      - name: Package CLI
        shell: pwsh
        run: Compress-Archive -Path target/release/mojovoice.exe, README.md, LICENSE -DestinationPath mojovoice-windows-x64.zip

      # whisper.cpp on Vulkan for AMD/Intel GPUs; needs vulkan-1.dll (GPU driver) at launch.
      # Short target dirs: whisper.cpp's nested vulkan-shaders-gen build otherwise exceeds
      # MSBuild's 260-character path limit.
      - name: Build CLI with Vulkan
        run: cargo build --release --features whisper-vulkan --target-dir D:\tv

      - name: Build CLI with CUDA
        env:
          CUDA_COMPUTE_CAP: "80"
        run: cargo build --release --features cuda,whisper-vulkan --target-dir D:\tc

      - name: Package CUDA CLI
        shell: pwsh
        run: Compress-Archive -Path D:\tc\release\mojovoice.exe, README.md, LICENSE -DestinationPath mojovoice-windows-x64-cuda.zip

      # Bundled into the installer next to the app (tauri.windows.conf.json externalBin)
      - name: Stage CLIs as Tauri sidecars
        shell: bash
        run: |
          mkdir -p ui/src-tauri/binaries
          cp target/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-x86_64-pc-windows-msvc.exe
          cp /d/tv/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-vulkan-x86_64-pc-windows-msvc.exe
          cp /d/tc/release/mojovoice.exe ui/src-tauri/binaries/mojovoice-cuda-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build installer
        working-directory: ui
        run: npm run tauri build

      - name: Upload CLI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mojovoice-windows-x64.zip
          asset_name: mojovoice-windows-x64.zip
          asset_content_type: application/zip

      - name: Upload CUDA CLI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mojovoice-windows-x64-cuda.zip
          asset_name: mojovoice-windows-x64-cuda.zip
          asset_content_type: application/zip

      - name: Upload installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ui/src-tauri/target/release/bundle/nsis/mojovoice_${{ steps.version.outputs.VERSION }}_x64-setup.exe
          asset_name: MojoVoice-windows-x64-setup.exe
          asset_content_type: application/octet-stream

  build-tauri-macos-arm:
    name: Build Desktop App (macOS ARM)
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ui/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npm run tauri

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Upload dmg
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ui/src-tauri/target/release/bundle/dmg/mojovoice_${{ steps.version.outputs.VERSION }}_aarch64.dmg
          asset_name: MojoVoice-macos-arm64.dmg
          asset_content_type: application/octet-stream

